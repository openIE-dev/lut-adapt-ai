[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "central-limit-ai"
version = "0.3.0"
authors = [{ name = "David Charlot" }]
description = "Mixture of Limits: 64-lane Engram/DiffLUT-Net LUT6, Mamba-3 Complex MIMO SSD, HC-SOINN, and JEPA-EBRM with downward Verilog compilation (Open Interface Engineering)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "nvidia-ml-py>=12.535.0; platform_system == 'Linux' or platform_system == 'Windows'",
    "triton>=3.0.0; platform_system == 'Linux'",
    "tqdm>=4.66.0",
    "transformers>=5.20.0",
    "safetensors>=0.4.5",
    "tokenizers>=0.21.0",
    "huggingface-hub>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mol-agent = "clai.service.openai_mcp_agent:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
